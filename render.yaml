# Render Blueprint for the API and the task worker (docs/DEPLOYMENT.md).
# Secrets are `sync: false`: Render asks for them when the Blueprint is created.
envVarGroups:
  - name: zotdor-backend
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.zotdor.uz,zotdor-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://web.zotdor.uz,https://panel.zotdor.uz,https://zotdor.uz,https://www.zotdor.uz
      - key: CSRF_TRUSTED_ORIGINS
        value: https://web.zotdor.uz,https://panel.zotdor.uz
      - key: CSRF_COOKIE_DOMAIN
        value: .zotdor.uz
      - key: FRONTEND_URL
        value: https://web.zotdor.uz
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: nhost
      - key: NHOST_STORAGE_URL
        sync: false
      - key: NHOST_ADMIN_SECRET
        sync: false
      - key: NHOST_PUBLIC_BUCKET
        value: media-public
      - key: NHOST_PRIVATE_BUCKET
        value: media-private
      - key: MEDIA_PROCESS_SYNC
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: ZotdorPlatformBot
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: LEADS_TELEGRAM_CHAT_ID
        sync: false
      - key: SUPPORT_TELEGRAM_CHAT_ID
        sync: false
      - key: PAYMENTS_PROVIDER
        value: click
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

services:
  - type: web
    name: zotdor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    domains:
      - api.zotdor.uz
    buildFilter:
      paths:
        - backend/**
    envVars:
      - fromGroup: zotdor-backend
      # true = the worker runs inside this service; then delete the zotdor-worker service below.
      - key: RUN_WORKER_IN_WEB
        value: "false"

  - type: worker
    name: zotdor-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python manage.py procrastinate worker --concurrency 4
    region: frankfurt
    plan: starter
    buildFilter:
      paths:
        - backend/**
    envVars:
      - fromGroup: zotdor-backend
