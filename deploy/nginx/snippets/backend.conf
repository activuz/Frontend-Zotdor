# API, uploaded media and Django admin static files. Included by both server blocks.

client_max_body_size 70m;  # VIDEO_MAX_BYTES is 60 MB

# Only starting a login is throttled hard; the status poll runs every 2 s (F1).
location = /api/v1/auth/telegram/start {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location /django-admin/ {
    include /etc/nginx/snippets/proxy.conf;
}

location /static/ {
    alias /data/static/;
    expires 7d;
}

# Originals keep EXIF (GPS) until processed and are never public (BR-33); only the processed
# files are served.
location ~ ^/media/.*/orig- {
    return 404;
}

location /media/ {
    alias /data/media/;
    expires 30d;
    add_header X-Content-Type-Options "nosniff" always;
}
