<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a0f" />
    <meta name="robots" content="noindex" />
    <title>Internet yoʻq — Zotdor.uz</title>
    <!-- Shown by sw.js when a page cannot load. Self-contained: no network is available.
         Colours are the DESIGN.md tokens (ink, ink-muted, page, brand, surface). -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eef2dc;
        color: #1e3a0f;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 50%; border: 1px solid #1e3a0f; }
      h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 28px; margin: 16px 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #4a5e3a; margin: 0 0 20px; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #1e3a0f;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #3d6b2e; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Internet aloqasi yoʻq</h1>
      <p>Sahifani ochib boʻlmadi. Internetni yoki mobil maʼlumotlarni tekshirib, qayta urinib koʻring. Aloqa tiklanishi bilan sahifa oʻzi yangilanadi.</p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
    </main>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
